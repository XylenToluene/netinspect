# Намеренно ошибочные ServiceEntry.
# Валидатор Istio в кластере может отклонить их при `oc apply` — это нормально:
# тогда они демонстрируются только при чтении из папки (--from-dir).
#
#   legacy-db    — resolution STATIC, но endpoints не заданы
#   partner-apis — resolution DNS с хостом-звёздочкой и без endpoints
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: legacy-db
  namespace: netinspect-demo
spec:
  hosts:
    - legacy-db.corp.internal
  location: MESH_INTERNAL
  ports:
    - {number: 5432, name: tcp-pg, protocol: TCP}
  resolution: STATIC
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: partner-apis
  namespace: netinspect-demo
spec:
  hosts:
    - "*.partner.example.com"
  location: MESH_EXTERNAL
  ports:
    - {number: 443, name: https, protocol: HTTPS}
  resolution: DNS
