spec:
  selector: {app: productpage}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
# Намеренная ошибка: подов с app=details нет → у сервиса не будет endpoints.
apiVersion: v1
kind: Service
metadata:
  name: details
  namespace: netinspect-demo
  labels: {app: details}
spec:
  selector: {app: details}
  ports: [{name: http, port: 8080, targetPort: 8080}]
