---
apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: netinspect-demo
  labels: {app: reviews}
spec:
  selector: {app: reviews}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
