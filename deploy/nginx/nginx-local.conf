# Запуск nginx от обычного пользователя, без root и без установки конфигов.
# Из корня репозитория, в двух терминалах:
#   python -m netinspect serve --api-only                         # бэкенд API
#   nginx -p "$PWD" -e stderr -c deploy/nginx/nginx-local.conf    # интерфейс
# Открыть http://127.0.0.1:8080/ ; остановить — Ctrl+C.
# Статика берётся прямо из netinspect/ui/static, граф (graph.json) — из web/
# (python -m netinspect graph ... --web-dir web). Пути — относительно -p.

daemon off;
worker_processes 1;
pid /tmp/netinspect-nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    access_log off;
    client_body_temp_path /tmp/netinspect-nginx-body;
    proxy_temp_path       /tmp/netinspect-nginx-proxy;
    fastcgi_temp_path     /tmp/netinspect-nginx-fastcgi;
    uwsgi_temp_path       /tmp/netinspect-nginx-uwsgi;
    scgi_temp_path        /tmp/netinspect-nginx-scgi;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root netinspect/ui/static;

        location = /graph.json {
            root web;
            expires -1;
            try_files $uri =404;
        }

        include netinspect-common.inc;
    }
}
