# Server-блок для системного nginx.
#   sudo cp deploy/nginx/netinspect.conf deploy/nginx/netinspect-common.inc /etc/nginx/conf.d/
#   sudo mkdir -p /var/www/netinspect
#   sudo cp netinspect/ui/static/* /var/www/netinspect/
#   python -m netinspect serve --api-only            # бэкенд на 127.0.0.1:8081
#   sudo nginx -t && sudo nginx -s reload
#
# ВАЖНО: в интерфейс вводится токен кластера. Вне localhost включайте HTTPS
# (пример ниже) — иначе токен идёт по сети открытым текстом.
# graph.json содержит манифесты ресурсов кластера (без Secret).

server {
    listen 8080;
    server_name _;

    # HTTPS (рекомендуется вне localhost):
    # listen 8443 ssl;
    # ssl_certificate     /etc/nginx/tls/netinspect.crt;
    # ssl_certificate_key /etc/nginx/tls/netinspect.key;

    root /var/www/netinspect;

    # Базовая авторизация (htpasswd -c /etc/nginx/netinspect.htpasswd user):
    # auth_basic "netinspect";
    # auth_basic_user_file /etc/nginx/netinspect.htpasswd;

    access_log /var/log/nginx/netinspect.access.log;
    error_log  /var/log/nginx/netinspect.error.log;

    location = /graph.json {
        expires -1;
        try_files $uri =404;
    }

    include conf.d/netinspect-common.inc;
}
